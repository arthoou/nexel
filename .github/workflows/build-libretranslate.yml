name: Build LibreTranslate CPU Windows & Linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false

      matrix:
        include:
          - os: ubuntu-latest
            name: linux-cpu
            zip: LibreTranslate-linux-cpu.zip

          - os: windows-latest
            name: windows-cpu
            zip: LibreTranslate-windows-cpu.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: |
          python -m pip install libretranslate pyinstaller

      - name: Show installed versions
        run: |
          python --version
          python -m pip show libretranslate
          pyinstaller --version

      - name: Create launcher
        shell: bash
        run: |
          cat > launcher.py <<'PY'
          from libretranslate.main import main

          if __name__ == "__main__":
              main()
          PY

      - name: Build LibreTranslate
        shell: bash
        run: |
          pyinstaller \
            --clean \
            --noconfirm \
            --onedir \
            --name libretranslate \
            launcher.py \
            --collect-all libretranslate \
            --collect-all argostranslate \
            --collect-all ctranslate2

      - name: Check build
        shell: bash
        run: |
          echo "Build contents:"
          find dist/libretranslate -maxdepth 2 -type f | head -100

      - name: Create ZIP
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile

          source = os.path.join("dist", "libretranslate")
          output = "${{ matrix.zip }}"

          if not os.path.isdir(source):
              raise SystemExit(
                  f"Build directory was not found: {source}"
              )

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9
          ) as archive:

              for root, dirs, files in os.walk(source):
                  for filename in files:

                      path = os.path.join(root, filename)
                      relative = os.path.relpath(path, source)

                      archive.write(
                          path,
                          relative
                      )

          size = os.path.getsize(output)

          print()
          print("ZIP created successfully")
          print("File:", output)
          print("Size:", round(size / 1024 / 1024, 2), "MB")
          PY

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
          compression-level: 0


  release:
    name: Create Release

    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Show downloaded files
        run: |
          echo "Release files:"
          find release-files -type f -print

      - name: Create or update Release
        uses: softprops/action-gh-release@v2

        with:
          tag_name: fix
          name: LibreTranslate CPU Build
          target_commitish: ${{ github.sha }}

          body: |
            Standalone LibreTranslate CPU builds.

            Included:
            - Windows x64
            - Linux x64

            Built automatically with GitHub Actions.

          files: |
            release-files/LibreTranslate-windows-cpu.zip
            release-files/LibreTranslate-linux-cpu.zip

          fail_on_unmatched_files: true
          overwrite_files: true
