name: Build LibreTranslate CPU Windows & Linux

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-cpu
            zip: LibreTranslate-linux-cpu.zip

          - os: windows-latest
            name: windows-cpu
            zip: LibreTranslate-windows-cpu.zip

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install LibreTranslate and PyInstaller
        run: |
          python -m pip install libretranslate pyinstaller

      - name: Create launcher
        shell: bash
        run: |
          cat > launcher.py <<'PY'
          from libretranslate.main import main

          if __name__ == "__main__":
              main()
          PY

      - name: Build LibreTranslate binary
        run: >
          pyinstaller
          --clean
          --noconfirm
          --onedir
          --name libretranslate
          launcher.py
          --collect-all libretranslate
          --collect-all argostranslate
          --collect-all ctranslate2

      - name: Create ZIP
        shell: bash
        run: |
          python - <<'PY'
          import os
          import zipfile

          source = os.path.join("dist", "libretranslate")
          output = "${{ matrix.zip }}"

          with zipfile.ZipFile(
              output,
              "w",
              compression=zipfile.ZIP_DEFLATED,
              compresslevel=9
          ) as z:
              for root, dirs, files in os.walk(source):
                  for file in files:
                      path = os.path.join(root, file)
                      relative = os.path.relpath(path, source)
                      z.write(path, relative)

          print(f"Created: {output}")
          PY

      - name: Check generated files
        shell: bash
        run: |
          echo "Generated package:"
          ls -lh "${{ matrix.zip }}" || true

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.zip }}
          if-no-files-found: error
          compression-level: 0


  release:
    name: Create GitHub Release

    needs:
      - build

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: release-files
          merge-multiple: true

      - name: Show release files
        run: |
          echo "Files that will be uploaded:"
          find release-files -type f -maxdepth 2 -print

      - name: Create or update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: fix
          name: LibreTranslate CPU Build
          target_commitish: ${{ github.sha }}

          body: |
            LibreTranslate standalone CPU builds.

            Builds included:
            - Windows x64 CPU
            - Linux x64 CPU

            Generated automatically using GitHub Actions.

          files: |
            release-files/LibreTranslate-windows-cpu.zip
            release-files/LibreTranslate-linux-cpu.zip

          fail_on_unmatched_files: true
          overwrite_files: true
